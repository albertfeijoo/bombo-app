<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bombo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bombo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna (máx. 480px), barra inferior flotante. Tres skins claros: Salvia (defecto), Pomelo, Cielo */
:root{
  --bg:#F5F6F1; --surface:#FFFFFF; --ink:#2B312D; --muted:#6E7771; --line:#E4E8E1;
  --accent:#6A8A68; --accent-ink:#FFFFFF; --accent-deep:#4E5A4B; --soft:#E7EEE4;
  --pop:#F4D2C1; --pop-ink:#7A3F27; --grad1:#E3EEE5; --grad2:#F8E7DB;
  --good:#3F8F62; --warn:#E0A03A;
  --shadow:0 1px 2px rgba(40,50,45,.04),0 10px 28px rgba(40,50,45,.07);
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:24px; color-scheme:light;
}
:root[data-skin="pomelo"]{
  --bg:#FCF6F3; --ink:#3A2E2D; --muted:#82716E; --line:#F1E3DE;
  --accent:#DD6A56; --accent-deep:#9B3B2B; --soft:#FCE5DF;
  --pop:#FFE7AE; --pop-ink:#664700; --grad1:#FDE1D8; --grad2:#FFF0CC;
  --shadow:0 1px 2px rgba(80,40,30,.04),0 10px 28px rgba(80,40,30,.07)}
:root[data-skin="cielo"]{
  --bg:#F3F6FA; --ink:#27313B; --muted:#687585; --line:#E1E7EF;
  --accent:#4C7FD3; --accent-deep:#24498C; --soft:#E3ECFB;
  --pop:#D5EEE1; --pop-ink:#1D573B; --grad1:#DFE9FA; --grad2:#E2F3EA;
  --shadow:0 1px 2px rgba(30,45,70,.04),0 10px 28px rgba(30,45,70,.08)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;transition:background .3s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:480px;margin:0 auto;padding-block:4px 120px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:700}
h2{font-size:1.4rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px}
.brand img{display:block;height:38px;width:auto}
.brand img.w{height:21px;margin-top:4px}
.splash{position:fixed;inset:0;z-index:50;background:#FDF8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease,visibility .5s;padding:24px}
.splash img{width:min(220px,58vw);height:auto;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
.splash p{font-family:var(--f-display);color:#4E5A4B;font-size:1rem;opacity:.75;animation:fadein .6s .5s both;text-align:center}
.splash.out{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:.75}}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 15px;font-size:.85rem;font-weight:600;color:var(--accent-deep)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;background:var(--soft);color:var(--accent-deep);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 14px;font-size:.85rem}
.btn:disabled{opacity:.4}
.banner{background:var(--soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--accent-deep)}

/* HERO */
.hero{background:linear-gradient(140deg,var(--grad1),var(--grad2));border-radius:28px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:color-mix(in srgb,var(--accent) 16%,transparent)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .8s ease}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:-.04em;color:var(--accent-deep)}
.ring .in span{font-size:.78rem;color:var(--muted);font-weight:600}
.hero .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .big{font-family:var(--f-display);font-size:1.05rem;font-weight:700;line-height:1.2}
.hero .tri{display:flex;gap:4px;margin-top:4px}
.hero .tri i{flex:1;height:6px;border-radius:9px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.hero .tri i.on{background:var(--accent)}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .tri{width:100%}}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count div{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.count b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.1;color:var(--accent-deep)}
.count span{font-size:.75rem;color:var(--muted)}
.bar{position:relative;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}

/* SIZE */
.size{background:var(--pop);color:var(--pop-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.size::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-70px;background:color-mix(in srgb,var(--surface) 35%,transparent);pointer-events:none}
.size>*{position:relative;z-index:1}
.size .label{color:var(--pop-ink);opacity:.7}
.seg{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:99px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:7px 10px;font-size:.8rem;font-weight:600;color:var(--pop-ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sizerow{display:flex;gap:16px;align-items:center}
.emo{flex:0 0 auto;width:96px;height:96px;border-radius:50%;background:color-mix(in srgb,var(--surface) 70%,transparent);display:grid;place-items:center}
.emo svg{width:72px;height:72px;display:block}
@media (max-width:360px){.emo{width:76px;height:76px}.emo svg{width:58px;height:58px}}
.size .what{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,8vw,2.2rem);line-height:1.05;letter-spacing:-.02em}
.stats{display:flex;gap:10px}
.stats div{background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:16px;padding:8px 14px}
.stats b{font-family:var(--f-mono);font-size:1.05rem;display:block}
.stats span{font-size:.72rem;opacity:.75}
.size .btn{background:var(--surface);color:var(--pop-ink)}
.size .btn.ghost{background:transparent;border-color:color-mix(in srgb,var(--pop-ink) 30%,transparent)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.playing .pulse{animation:beat .43s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.7)}}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;padding-block:10px;border-top:1px solid var(--line);align-items:flex-start}
.list li:first-child{border-top:0}
.dot{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent-deep);font-size:.72rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:.85rem}
.quip{font-family:var(--f-display);font-size:1.08rem;font-weight:500;line-height:1.4;color:var(--accent-deep)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.answer{display:flex;justify-content:space-between;gap:10px;align-items:center}

/* WEEKS */
.weeks{display:flex;gap:6px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:0 0 auto;width:46px;height:46px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-mono);font-size:.9rem}
.weeks button.now{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-deep)}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.extra{background:var(--soft);border-radius:16px;padding:12px 14px}

/* AGENDA */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding-block:12px;border-top:1px solid var(--line);align-items:start}
.tl li:first-child{border-top:0}
.tl .wk{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.tl li.now .wk{color:var(--accent-deep);font-weight:700}
.tl li.done h3{text-decoration:line-through;color:var(--muted)}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--accent-deep);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.check{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-size:.85rem;padding:0;flex:0 0 auto}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
form.f{display:grid;gap:10px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{min-height:130px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* NOTES */
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:0;background:var(--bg);border-radius:99px;padding:7px 12px;font-size:.85rem}
.moods button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:10px}

/* KIT */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--surface);border:0;border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:var(--shadow)}
.tool b{font-family:var(--f-display);font-size:1.08rem;font-weight:700;color:var(--accent-deep)}
.tool span{font-size:.82rem;color:var(--muted)}
.tool.main{grid-column:1/-1;background:linear-gradient(140deg,var(--grad1),var(--grad2))}
.back{border:0;background:transparent;padding:0;color:var(--accent-deep);font-weight:600;font-size:.9rem;align-self:flex-start}
.bigbtn{width:min(210px,66vw);aspect-ratio:1;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:1.4rem;font-weight:700;margin:6px auto;display:grid;place-items:center;max-width:100%;box-shadow:0 0 0 14px var(--soft)}
.bigbtn.on{background:var(--warn);color:#2A1A00;box-shadow:0 0 0 14px color-mix(in srgb,var(--warn) 22%,transparent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 22px color-mix(in srgb,var(--warn) 14%,transparent)}}
.timer{text-align:center;font-family:var(--f-mono);font-size:2.4rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 4px}
td{padding:8px 4px;border-top:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ck{display:flex;gap:12px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.ck:first-of-type{border-top:0}
.ck span{flex:1;min-width:0}
.ck.on span{color:var(--muted);text-decoration:line-through}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:0 4px}
.prog{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.ns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ns button{border:0;background:var(--bg);border-radius:99px;padding:5px 10px;font-size:.76rem}
.ns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* NAV */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{pointer-events:auto;max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:7px 0;border-radius:20px;transition:background .2s,color .2s}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent-deep);background:var(--soft)}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(20,25,22,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:28px 28px 0 0;max-height:88%;overflow:auto;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skins button{border:2px solid transparent;background:var(--bg);border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.85rem;font-weight:600}
.skins button[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:flex}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.sw i:first-child{margin-left:0}
.ruler{overflow-x:auto;padding-block:8px}
.ruler .r{height:56px;border-radius:0 28px 28px 0;background:var(--pop);position:relative;
  background-image:repeating-linear-gradient(90deg,var(--pop-ink) 0 1px,transparent 1px 1cm);background-size:1cm 14px;background-repeat:repeat-x;background-position:0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--accent-deep);color:#fff;padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:30}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px}
.toggle input{width:auto;accent-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.langs button{border:2px solid transparent;background:var(--bg);border-radius:14px;padding:10px 6px;font-weight:600;font-size:.92rem}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-deep)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}html{-webkit-text-size-adjust:100%}</style>
</head>
<body>

<div class="app" id="app"></div>

òria clínica, carnet d’embaràs i primera analítica (grup sanguini, serologies, hemograma)."],"t2":["Test prenatal no invasiu (opcional)","ADN fetal en sang materna. Depèn del centre i de cada cas."],"t3":["Ecografia del primer trimestre","Confirma les setmanes i, juntament amb una analítica, fa el cribratge de cromosomopaties."],"t4":["Ecografia morfològica","La grossa: revisen òrgans i anatomia a fons. Ves-hi sense pressa."],"t5":["Test d’O’Sullivan","Cribratge de diabetis gestacional. Beus una cosa molt dolça i esperes una hora quieta. Porta’t entreteniment."],"t6":["Analítica del segon trimestre","Hemograma, glucosa i anticossos si ets Rh negatiu."],"t7":["Vacuna de la tos ferina","Es recomana a cada embaràs, millor a l’inici d’aquest interval. Protegeix el nadó els primers mesos."],"t8":["Anti-D (només si ets Rh negatiu)","Injecció per prevenir problemes per incompatibilitat Rh."],"t9":["Classes de preparació al part","Respiració, senyals de part i què cal portar. Que hi vingui també el teu acompanyant."],"t10":["Ecografia del tercer trimestre","Creixement, posició del nadó, placenta i líquid."],"t11":["Analítica del tercer trimestre","Inclou coagulació, útil si vols epidural."],"t12":["Cultiu d’estreptococ B","Un frotis ràpid. Si surt positiu, et donaran antibiòtic durant el part."],"t13":["Monitors i controls de benestar","Si passes de data, més controls. El nadó no s’ha llegit el calendari."]},"BAG":{"me":["Per a tu",["Camises de dormir o pijames que s’obrin per davant","Bata i sabatilles","Sostenidors de lactància","Calces de cotó o d’un sol ús (moltes)","Compreses postpart","Discos de lactància","Necesser: raspall, xampú, cacau, gomes","Roba còmoda per sortir (talla d’embaràs, sí)","Carregador amb cable llarg","Snacks per a després (te’ls hauràs guanyat)"]],"baby":["Per al nadó",["Bodis (3–4)","Pijames (3–4)","Gorreta i mitjons","Mussolines (2–3)","Bolquers de nounat","Tovalloletes","Conjunt per sortir de l’hospital","Mantita","Cadireta de cotxe instal·lada "a toy guitar","a big cat","a three-tier cake"],"37":["a bunch of chard","a bath mat","a corgi","the dessert table at a christening"],"38":["a leek","a ukulele","a Humboldt penguin","the biggest coca at the summer fair"],"39":["a small watermelon","a cabin suitcase (almost)","a red panda (minus the tail)","every sweet from this trimester"],"40":["a pumpkin","a baby. Finally, a baby.","a Labrador puppy","a whole wedding cake"]},"MILE":{"4":["Implantation in the womb is complete","The cell layers that will become organs are forming","The placenta starts to form"],"5":["The neural tube (future brain and spinal cord) begins to close","The early heart starts to beat","The yolk sac feeds them for now"],"6":["The heartbeat can now be seen on a scan","Arm and leg buds appear","Eyes and ears start to take shape"],"7":["The brain is growing at top speed","Hands and feet look like little paddles","The kidneys are forming"],"8":["Fingers start to separate","They move, even if you can’t feel it yet","Eyelids are forming"],"9":["The embryonic “tail” disappears","Elbows and knees appear","Sex organs begin to form"],"10":["Officially goes from embryo to foetus","Nails start to grow","Vital organs are formed: now it’s time to grow"],"11":["Opens and closes their hands","Hair follicles appear","Bones begin to harden"],"12":["The sucking reflex appears","The kidneys are making urine","The intestines settle into place"],"13":["Fingerprints form","Vocal cords develop","The first trimester wraps up"],"14":["Pulls faces (practising the ones they’ll give you)","Lanugo, a very fine hair, appears","Can suck their thumb"],"15":["Senses light through the eyelids","The skeleton shows clearly on a scan","Moves every joint"],"16":["The eyes move","The heart pumps about 25 litres of blood a day","Some people feel the first movements"],"17":["Starts storing fat","Cartilage is turning into bone","The umbilical cord gets stronger"],"18":["The ears are in their final place","Can yawn","Gets hiccups now and then"],"19":["A protective coating (vernix) covers the skin","The senses develop fast","If it’s a girl, she already has eggs in her ovaries"],"20":["Halfway there","Swallows amniotic fluid","Movements are easier to feel"],"21":["Eyebrows appear","Movements are more coordinated","The digestive system is practising"],"22":["Develops a sense of touch","The eyes are formed (the iris has no colour yet)","Starts to recognise your voice"],"23":["The lungs grow blood vessels","Reacts to loud noises","The skin is thin and wrinkly"],"24":["The lungs start producing surfactant","Has sleep and wake cycles","The inner ear now controls balance"],"25":["Gains fat and rounds out","Hair starts to get colour and texture","Responds to your voice"],"26":["Opens their eyes","Reacts to light","Brain activity increases"],"27":["The brain is very active","Gets hiccups often","The third trimester begins"],"28":["Has eyelashes and blinks","Probably dreams (REM sleep)","Many start turning head-down over the next few weeks"],"29":["Bones get stronger: calcium needed","Kicks get stronger","Muscles mature"],"30":["Bone marrow makes red blood cells","Lanugo starts to disappear","The brain gets more folds"],"31":["Processes information from all the senses","Turns their head from side to side","Keeps storing fat"],"32":["Has toenails now","Practises breathing movements","Less room: the kind of movement changes"],"33":["Skull bones stay flexible for birth","Receives antibodies from you","Pupils react to light"],"34":["The nervous system matures","The vernix coating thickens","Many are already head-down"],"35":["The kidneys are fully developed","Gains weight very fast","The liver is processing some waste"],"36":["Round cheeks appear","The lanugo is almost gone","May start to engage in the pelvis"],"37":["Early term","Practises sucking","Has a firm grip"],"38":["Their organs are ready","The vernix is wearing off","You’re probably already making colostrum"],"39":["The lungs keep maturing right to the end","Fat will help them regulate temperature","Ready, but in no hurry"],"40":["The due date arrives","Due doesn’t mean exact: few babies are born on the day","Taking their time"]},"RANGE":[[["Out-of-this-world tiredness","Tender breasts","Bloodhound sense of smell","Needing to wee"],"Nobody can tell yet, but you could fall asleep standing up on the bus."],[["Nausea (not just in the morning)","Tiredness","Going off food you used to love","Bloating"],"“Morning sickness” can’t tell the time. Keep crackers on the bedside table."],[["Nausea easing off","Constipation","Mood swings","More visible veins"],"The end of the first trimester is in sight. Classic moment to share the news (or not: your call)."],[["More energy","Stuffy nose","Gums that bleed a bit","Twinges in the groin"],"Welcome to the “good” trimester. Use the energy before someone asks you for it."],[["First movements (bubbles? wind?)","Backache","Heartburn","Proper hunger"],"Was it the baby or dinner? For a few weeks, both answers are valid."],[["Leg cramps","Swollen feet","The odd Braxton Hicks contraction","Itchy bump"],"People start touching your bump without asking. You’re entitled to touch theirs."],[["Heartburn (again)","Shortness of breath","Insomnia","A wee every 20 minutes"],"Sleeping becomes a strategy game played with pillows."],[["Pelvic pressure","More frequent Braxton Hicks","Tiredness","General clumsiness"],"Picking something up off the floor now requires advance planning."],[["Urge to clean everything (nesting)","Pelvic pressure","The mucus plug may come away","Expert-level impatience"],"Every “Nothing yet?” you answer counts as endurance training."]],"TIPS":["If you get cramp at night, straighten your leg and pull your toes towards you.","From the second trimester, sleep on your side. A pillow between your knees helps a lot.","A 30-minute walk a day counts as exercise. Walking to the fridge, not so much.","Wash fruit and veg well and avoid raw or undercooked meat.","Eating little and often helps with nausea and heartburn.","Drink water even if you live in the loo. The two come as a package.","For heartburn: don’t lie down right after dinner and raise the head of the bed a little.","Pelvic floor: squeeze as if stopping a wee, hold for 5 seconds and release. Best not practised while actually weeing.","Swollen feet: put them up for a while at the end of the day. Official excuse for the sofa.","Small oily fish (sardines, anchovies) are a good source of omega-3. Avoid swordfish and bluefin tuna.","Cheese: pasteurised is your friend. Raw-milk cheese can wait.","In the car, the lap belt goes under your bump, across your hips.","Swimming eases your back and makes you feel light for a good while.","Sensitive gums: use a soft brush and don’t skip the dentist.","Ask for help carrying heavy things. It’s not weakness, it’s logistics.","For constipation: fibre, water and moving. In whatever order you like.","Mood swings are normal. If the sadness lasts for days, tell your midwife.","If you notice fewer movements than usual in the third trimester, call your maternity unit. Don’t wait until tomorrow."],"FACTS":["Around week 20 the baby is already swallowing amniotic fluid. Training for purée.","Fingerprints form at the end of the first trimester and are unique, even in identical twins.","Your blood volume rises by 40–50 %. That’s why you feel warm even in January.","Very few babies arrive on their due date. It’s an estimate, not an appointment.","From weeks 18–20 they can hear outside sounds. Your voice is their favourite, even if you sing terribly.","Babies get hiccups in the womb. They feel like little rhythmic taps.","The baby’s heart beats at 110–160 beats per minute, almost twice as fast as yours.","Feet can grow during pregnancy and sometimes keep the new size.","What you eat changes the taste of the amniotic fluid. They’re already sampling your menu.","At birth a baby has about 300 bones. Over the years some fuse until there are 206.","The womb grows to hundreds of times its original size. And then goes back. Pure engineering."],"TWINS":["With twins, nausea and tiredness can be stronger. Ask for help early and without guilt.","You’ll have more check-up scans. It’s not a bad sign: it’s the standard care for twins.","Twins tend to arrive early. Have your bag ready by around week 30."],"SOLO":["Pick one or two people you trust for the important appointments. You don’t have to go to everything alone.","Look into leave and support for single-parent families: it can make a real difference.","Set up your support network for the first weeks now: meals, shopping and someone to keep watch while you sleep."],"TESTS":{"t0":["Flu jab (in season)","Recommended in any trimester during the autumn–winter campaign."],"t1":["First midwife appointment","Medical history, maternity notes and first blood tests (blood group, infections, blood count)."],"t2":["Non-invasive prenatal test (optional)","Baby’s DNA in your blood. Depends on your hospital and your case."],"t3":["First-trimester scan","Confirms your dates and, with a blood test, screens for chromosomal conditions."],"t4":["Anomaly scan","The big one: organs and anatomy checked in detail. Don’t book anything straight after."],"t5":["Glucose tolerance test","Screening for gestational diabetes. You drink something very sweet and sit still for an hour. Bring entertainment."],"t6":["Second-trimester blood tests","Blood count, glucose and antibodies if you’re Rh negative."],"t7":["Whooping cough vaccine","Recommended in every pregnancy, ideally early in this window. Protects the baby in their first months."],"t8":["Anti-D (only if you’re Rh negative)","An injection to prevent problems from Rh incompatibility."],"t9":["Antenatal classes","Breathing, signs of labour and what to pack. Bring your birth partner too."],"t10":["Third-trimester scan","Growth, baby’s position, placenta and fluid."],"t11":["Third-trimester blood tests","Includes clotting, useful if you want an epidural."],"t12":["G const dayIdx=()=>Math.floor(Date.now()/864e5);
const baby=()=>S.nick.trim()||t('your_baby');

/* ============ VISTAS ============ */
const ICONS={
hoy:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
semanas:'<svg viewBox="0 0 24 24"><path d="M4 18c3-9 13-9 16 0"/><circle cx="12" cy="8" r="2"/></svg>',
agenda:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
notas:'<svg viewBox="0 0 24 24"><path d="M5 19l1-4L16 5l3 3L9 18z"/><path d="M14 7l3 3"/></svg>',
kit:'<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M9 8V6a3 3 0 0 1 6 0v2M12 12v4M10 14h4"/></svg>'};

function header(){return `<header class="top"><div class="brand" role="img" aria-label="Bombo"><img src="${LOGO_MARK}" alt=""><img class="w" src="${LOGO_WORD}" alt=""></div><button class="iconbtn" data-a="settings">${t('settings')}</button></header>`}
function sampleBanner(){return S.sample?`<div class="banner"><span>${t('sample')}</span><button class="btn accent small" data-a="settings">${t('configure')}</button></div>`:''}

function sizeCard(w){
  const s=SIZE[w];const ci=CAT.find(c=>c[0]===S.cat)||CAT[0];
  return `<section class="size" aria-label="${t('size_aria')}">
  <div class="seg" role="group" aria-label="${t('compare_with')}">${CAT.map(c=>`<button data-a="cat" data-v="${c[0]}" aria-pressed="${c[0]===ci[0]}">${c[1]}</button>`).join('')}</div>
  <div class="sizerow"><div class="emo" role="img" aria-label="${esc(t('drawing_of',{x:s[ci[2]]}))}">${drawing(w,ci[2]-2)}</div><div style="min-width:0"><div class="label">${esc(t('week_size',{w,b:baby()}))}</div><div class="what">${esc(s[ci[2]])}</div></div></div>
  <div class="stats"><div><b>${cmTxt(s[0])}</b><span>${w<20?t('crown_rump'):t('crown_heel')}</span></div><div><b>${grams(s[1])}</b><span>${t('approx_weight')}</span></div></div>
  <div class="row"><button class="btn small" data-a="real" data-w="${w}">${t('see_real')}</button><button class="btn ghost small ${beat.on?'playing':''}" data-a="beat" id="beatBtn"><span class="pulse"></span>${beat.on?t('stop_beat'):t('play_beat')}</button></div>
  </section>`;
}
function weekDetail(w,showSymptoms=true){
  const r=rangeFor(w);const tr=tri(w);
  let extra='';
  if(S.twins)extra+=`<div class="extra"><div class="label">${t('if_twins')}</div><p>${TWINS[tr-1]}</p></div>`;
  if(S.solo)extra+=`<div class="extra"><div class="label">${t('if_solo')}</div><p>${SOLO[tr-1]}</p></div>`;
  return `<section class="card stack"><h2>${esc(t('this_week',{b:baby()}))}</h2>
  <ul class="list">${MILE[w].map((m,i)=>`<li><span class="dot">${i+1}</span><span>${m}</span></li>`).join('')}</ul></section>
  ${showSymptoms?`<section class="card stack"><div class="label">${t('you_may_notice')}</div><div class="chips">${r[2].map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="quip">${r[3]}</p>${extra}</section>`:''}`;
}

function vHoy(){
  const G=ga();const w=clampW(G.w);
  const pct=Math.min(100,Math.max(0,G.g/280*100));
  const fpp=parse(S.fpp);
  const lw=Math.floor(Math.max(0,G.left)/7),ld=Math.max(0,G.left)%7;
  const next=TESTS.filter(x=>x.id!=='t0'&&!S.testsDone[x.id]&&x.b>=G.w).sort((a,b)=>a.a-b.a)[0];
  const appt=S.appts.filter(a=>parse(a.date)>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const tip=TIPS[(dayIdx())%TIPS.length], fact=FACTS[(dayIdx()+3)%FACTS.length];
  const answer=t('answer',{w:G.w,d:G.d,date:fmtD(fpp)});
  const over=G.left<0?`<p class="quip">${esc(G.left===-1?t('over1',{b:baby()}):t('overN',{n:-G.left,b:baby()}))}</p>`:'';
  return `${header()}<div class="stack">${sampleBanner()}
  <section class="hero">
    <div class="ring" role="img" aria-label="${t('ring_aria',{w:G.w,d:G.d,p:Math.round(pct)})}">
      <svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="56" fill="none" stroke-width="12"/><circle class="val" cx="66" cy="66" r="56" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="${(351.86*(1-pct/100)).toFixed(1)}"/></svg>
      <div class="in"><b>${G.w}</b><span>${t('plus_days',{d:G.d})}</span></div>
    </div>
    <div class="meta">
      <div class="label">${t('week_now',{w:Math.min(G.w+1,42)})}</div>
      <div class="big">${t('due_date')}<br>${fmtD(fpp,{day:'numeric',month:'long',year:'numeric'})}</div>
      <div class="tri" aria-hidden="true">${[1,2,3].map(x=>`<i class="${x<=tri(G.w)?'on':''}"></i>`).join('')}</div>
      <span class="muted" style="font-size:.8rem">${t('trimester',{t:tri(G.w)})}</span>
    </div>
  </section>
  ${G.left>=0?`<div class="count"><div><b class="num">${G.left}</b><span>${t('days')}</span></div><div><b class="num">${lw}<small style="font-size:.6em">${t('wk_short')}</small> ${ld}<small style="font-size:.6em">${t('day_short')}</small></b><span>${t('in_weeks')}</span></div><div><b class="num">${Math.round(pct)}%</b><span>${t('completed')}</span></div></div>`:over}
  ${sizeCard(w)}
  <section class="card answer"><div><div class="label">${t('when_asked')}</div><p>${esc(answer)}</p></div><button class="btn ghost small" data-a="copy" data-v="${esc(answer)}">${t('copy')}</button></section>
  ${weekDetail(w)}
  <div class="two">
    <section class="card stack"><div class="label">${t('tip_day')}</div><p>${tip}</p></section>
    <section class="card stack"><div class="label">${t('did_you_know')}</div><p>${fact}</p></section>
  </div>
  <section class="card stack"><div class="label">${t('next_up')}</div>
    ${appt?`<p><b>${esc(appt.title)}</b><br><span class="muted">${fmtD(parse(appt.date),{weekday:'long',day:'numeric',month:'long'})}${appt.time?' · '+esc(appt.time):''}</span></p>`:''}
    ${next?`<p><b>${next.t}</b><br><span class="muted">${t('weeks_range',{r:next.a+(next.b!==next.a?'–'+next.b:'')})}</span></p>`:''}
    <button class="btn ghost small" data-a="tab" data-v="agenda" style="justify-self:start;align-self:flex-start">${t('see_agenda')}</button>
  </section>
  <p class="muted" style="font-size:.8rem">${t('disclaimer')}</p>
  </div>`;
}

function vSemanas(){
  const G=ga();const cur=clampW(G.w);const w=S.weekView||cur;
  let btns='';for(let i=4;i<=40;i++)btns+=`<button data-a="week" data-v="${i}" class="${i===cur?'now':''}" aria-pressed="${i===w}" aria-label="${t('week_n',{n:i})}">${i}</button>`;
  return `${header()}<div class="stack"><div><h2>${t('week_by_week')}</h2><p class="muted">${t('week_hint')}</p></div>
  <div class="weeks" id="weeks">${btns}</div>
  ${sizeCard(w)}${weekDetail(w)}
  ${(!S.twins&&!S.solo)?`<p class="muted" style="font-size:.88rem">${t('twins_hint')}</p>`:''}
  </div>`;
}

function vAgenda(){
  const G=ga();
  const items=TESTS.slice().sort((a,b)=>a.a-b.a).map(x=>{
    const done=!!S.testsDone[x.id];const now=G.w>=x.a&&G.w<=x.b;
    const pill=done?`<span class="pill good">${t('done')}</span>`:now?`<span class="pill">${t('now')}</span>`:'';
    return `<li class="${now?'now':''} ${done?'done':''}"><span class="wk">${t('wk_prefix')} ${x.a}${x.b!==x.a?'–'+x.b:''}</span><div class="stack" style="gap:3px;min-width:0"><div class="row" style="gap:8px"><h3>${x.t}</h3>${pill}</div><p class="muted" style="font-size:.88rem">${x.d}</p></div><button class="check" data-a="test" data-v="${x.id}" aria-pressed="${done}" aria-label="${esc(t('mark_done',{x:x.t}))}">${done?'✓':''}</button></li>`}).join('');
  const ap=S.appts.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return `${header()}<div class="stack"><div><h2>${t('agenda')}</h2><p class="muted">${t('agenda_sub')}</p></div>
  <section class="card stack"><h3>${t('my_appts')}</h3>
  ${ap.length?`<ul class="list">${ap.map(a=>{const past=parse(a.date)<today();return `<li style="${past?'opacity:.55':''}"><div style="flex:1;min-width:0"><b>${esc(a.title)}</b><br><span class="muted" style="font-size:.88rem">${fmtD(parse(a.date),{weekday:'short',day:'numeric',month:'short'})}${a.time?' · '+esc(a.time):''}${a.place?' · '+esc(a.place):''}</span></div><button class="btn ghost small" data-a="copyappt" data-v="${a.id}">${t('copy')}</button><button class="x" data-a="delappt" data-v="${a.id}" aria-label="${t('delete')}">×</button></li>`}).join('')}</ul>`:`<p class="empty">${t('no_appts')}</p>`}
  <form class="f" id="apptForm">
    <input id="apTitle" placeholder="${esc(t('appt_what'))}" required>
    <div class="frow"><input id="apDate" type="date" required value="${iso(today())}"><input id="apTime" type="time"></div>
    <input id="apPlace" placeholder="${esc(t('appt_where'))}">
    <button class="btn accent" type="submit">${t('add_appt')}</button>
  </form>
  <p class="muted" style="font-size:.8rem">${t('appt_copy_hint')}</p>
  </section>
  <section class="card stack"><h3>${t('usual_tests')}</h3><p class="muted" style="font-size:.85rem">${t('tests_hint')}</p><ul class="tl">${items}</ul></section>
  </div>`;
}

let noteMoods=[],notePrompt=0;
const moodsOf=n=>Array.isArray(n.moods)?n.moods:(n.mood?[n.mood]:[]);
function vNotas(){
  const notes=S.notes.slice().sort((a,b)=>b.at-a.at);
  return `${header()}<div class="stack"><div><h2>${t('notes')}</h2><p class="muted">${t('notes_sub')}</p></div>
  <section class="card stack">
    <div class="label">${t('feel_today')} <span style="text-transform:none;letter-spacing:0;font-weight:500">${t('pick_any')}</span></div>
    <div class="moods">${MOODS.map(m=>`<button data-a="mood" data-v="${esc(m)}" aria-pressed="${noteMoods.includes(m)}">${m}</button>`).join('')}</div>
    <textarea id="noteText" placeholder="${esc(PROMPTS[notePrompt%PROMPTS.length])}"></textarea>
    <div class="row" style="justify-content:space-between"><button class="btn ghost small" data-a="prompt">${t('another_idea')}</button><button class="btn accent" data-a="savenote">${t('save')}</button></div>
  </section>
  <section class="notes">${notes.length?notes.map(n=>`<article class="note"><div class="row" style="justify-content:space-between"><span class="label">${new Date(n.at).toLocaleDateString(LOCALE,{weekday:'short',day:'numeric',month:'short'})}</span><button class="x" data-a="delnote" data-v="${n.id}" aria-label="${t('delete_note')}">×</button></div>${moodsOf(n).length?`<div class="chips">${moodsOf(n).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}<p>${esc(n.text)}</p></article>`).join(''):`<p class="empty">${t('no_notes')}</p>`}</section>
  </div>`;
}

/* ---------- KIT ---------- */
function vKit(){
  if(S.kit)return header()+`<div class="stack"><button class="back" data-a="kit" data-v="">← ${t('kit')}</button>${({contr:kContr,maleta:kMaleta,listas:kListas,nombres:kNombres,patadas:kPatadas,plan:kPlan})[S.kit]()}</div>`;
  return `${header()}<div class="stack"><div><h2>${t('kit')}</h2><p class="muted">${t('kit_sub')}</p></div>
  <div class="grid">${TOOLS.map(x=>`<button class="tool ${x[3]?'main':''}" data-a="kit" data-v="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div></div>`;
}
const mmss=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
function kContr(){
  const on=S.contrOn;const list=S.contr.slice().reverse();
  const hour=S.contr.filter(c=>c.s>Date.now()-36e5);
  const avgDur=hour.length?hour.reduce((a,c)=>a+(c.e-c.s),0)/hour.length/1000:0;
  const ints=[];for(let i=1;i<S.contr.length;i++)if(S.contr[i].s>Date.now()-36e5)ints.push((S.contr[i].s-S.contr[i-1].s)/1000);
  const avgInt=ints.length?ints.reduce((a,b)=>a+b,0)/ints.length:0;
  return `<h2>${t('contractions')}</h2>
  <button class="bigbtn ${on?'on':''}" data-a="contr">${on?t('end'):t('start')}</button>
  <div class="timer" id="cTimer" aria-live="polite">${on?mmss((Date.now()-on)/1000):'0:00'}</div>
  <p class="muted" style="text-align:center;margin-top:-8px">${on?t('breathe'):t('press_start')}</p>
  <div class="count"><div><b class="num">${hour.length}</b><span>${t('last_hour')}</span></div><div><b class="num">${avgDur?mmss(avgDur):'–'}</b><span>${t('avg_dur')}</span></div><div><b class="num">${avgInt?mmss(avgInt):'–'}</b><span>${t('avg_every')}</span></div></div>
  <section class="card stack">${list.length?`<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>${t('time')}</th><th>${t('lasts')}</th><th>${t('since_prev')}</th></tr></thead><tbody>${list.map((c,i)=>{const idx=S.contr.length-1-i;const prev=S.contr[idx-1];return `<tr><td>${idx+1}</td><td>${new Date(c.s).toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'})}</td><td>${mmss((c.e-c.s)/1000)}</td><td>${prev?mmss((c.s-prev.s)/1000):'–'}</td></tr>`}).join('')}</tbody></table></div><button class="btn ghost small" data-a="ask" data-v="resetContr" style="align-self:flex-start">${t('clear_log')}</button>`:`<p class="empty">${t('no_contr')}</p>`}</section>
  <p class="muted" style="font-size:.85rem">${t('contr_ref')}</p>`;
}
function bagItems(){const o={};for(const k in BAG)o[k]={label:BAG[k][0],items:BAG[k][1].map((x,i)=>({id:k+i,t:x}))};o.mine={label:t('bag_mine'),items:S.bagCustom};return o}
function kMaleta(){
  const g=bagItems();let tot=0,ok=0;for(const k in g)g[k].items.forEach(i=>{tot++;if(S.bag[i.id])ok++});
  return `<div class="row" style="justify-content:space-between"><h2>${t('bag_title')}</h2><span class="prog">${ok}/${tot}</span></div>
  <div class="bar"><i style="width:${tot?ok/tot*100:0}%"></i></div>
  <p class="muted">${ok===tot?t('bag_ready'):t('bag_hint')}</p>
  ${Object.entries(g).map(([k,sec])=>`<section class="card"><h3 style="margin-bottom:6px">${esc(sec.label)}</h3>${sec.items.map(i=>`<div class="ck ${S.bag[i.id]?'on':''}"><button class="check" data-a="bag" data-v="${i.id}" aria-pressed="${!!S.bag[i.id]}" aria-label="${esc(i.t)}">${S.bag[i.id]?'✓':''}</button><span>${esc(i.t)}</span>${k==='mine'?`<button class="x" data-a="delbag" data-v="${i.id}" aria-label="${t('remove')}">×</button>`:''}</div>`).join('')}
  ${k==='mine'?`<form class="row" id="bagForm" style="margin-top:8px;flex-wrap:nowrap"><input id="bagIn" placeholder="${esc(t('bag_add'))}"><button class="btn small" type="submit">${t('add')}</button></form>`:''}</section>`).join('')}`;
}
function kListas(){
  return `<h2>${t('lists')}</h2>
  ${S.lists.map(l=>{const ok=l.items.filter(i=>i.done).length;return `<section class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>${esc(l.name)}</h3><div class="row" style="gap:6px"><span class="prog">${ok}/${l.items.length}</span><button class="x" data-a="ask" data-v="delList:${l.id}" aria-label="${t('delete_list')}">×</button></div></div>
  ${l.items.map(i=>`<div class="ck ${i.done?'on':''}"><button class="check" data-a="li" data-v="${l.id}:${i.id}" aria-pressed="${i.done}" aria-label="${esc(i.t)}">${i.done?'✓':''}</button><span>${esc(i.t)}</span><button class="x" data-a="delli" data-v="${l.id}:${i.id}" aria-label="${t('remove')}">×</button></div>`).join('')}
  <form class="row" data-list="${l.id}" style="margin-top:8px;flex-wrap:nowrap"><input id="li-${l.id}" placeholder="${t('add')}"><button class="btn small" type="submit">${t('add')}</button></form></section>`}).join('')}
  <form class="row" id="newList" style="flex-wrap:nowrap"><input id="newListIn" placeholder="${esc(t('new_list'))}"><button class="btn accent small" type="submit">${t('create')}</button></form>`;
}
function kNombres(){
  const order={fav:0,maybe:1,veto:2};const list=S.names.slice().sort((a,b)=>order[a.s]-order[b.s]);
  return `<h2>${t('names')}</h2><p class="muted">${t('names_sub')}</p>
  <form class="row" id="nameForm" style="flex-wrap:nowrap"><input id="nameIn" placeholder="${esc(t('a_name'))}"><button class="btn accent small" type="submit">${t('add')}</button></form>
  <section class="card">${list.length?list.map(n=>`<div class="ck" style="${n.s==='veto'?'opacity:.6':''}"><span style="font-family:var(--f-display);font-size:1.1rem;${n.s==='veto'?'text-decoration:line-through':''}">${esc(n.n)}</span><div class="ns">${NS.map(s=>`<button data-a="nstat" data-v="${n.id}:${s[0]}" aria-pressed="${n.s===s[0]}">${s[1]}</button>`).join('')}</div><button class="x" data-a="delname" data-v="${n.id}" aria-label="${t('delete')}">×</button></div>`).join(''):`<p class="empty">${t('no_names')}</p>`}</section>`;
}
function kPatadas(){
  const k=S.kickOn;
  return `<h2>${t('kicks')}</h2><p class="muted">${t('kicks_sub')}</p>
  ${k?`<button class="bigbtn" data-a="kick">+1<br>${k.n}</button><div class="timer" id="kTimer">${mmss((Date.now()-k.s)/1000)}</div><button class="btn ghost" data-a="kickstop" style="align-self:center">${t('end_session')}</button>`:`<button class="btn accent" data-a="kickstart" style="align-self:flex-start">${t('start_session')}</button>`}
  <section class="card">${S.kicks.length?`<table><thead><tr><th>${t('day')}</th><th>${t('moves')}</th><th>${t('time')}</th></tr></thead><tbody>${S.kicks.slice().reverse().slice(0,10).map(s=>`<tr><td>${new Date(s.s).toLocaleDateString(LOCALE,{day:'numeric',month:'short'})} ${new Date(s.s).toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'})}</td><td>${s.n}</td><td>${mmss(s.d)}</td></tr>`).join('')}</tbody></table>`:`<p class="empty">${t('no_sessions')}</p>`}</section>`;
}
function kPlan(){
  return `<h2>${t('plan')}</h2><p class="muted">${t('plan_sub')}</p>
  <section class="card"><div class="f">${PLAN.map((p,pi)=>`<label class="stack" style="gap:4px"><span class="label">${p[1]}</span>${p[2]==='sel'?`<select data-plan="${p[0]}" id="pl-${p[0]}"><option value="">${t('undecided')}</option>${p[3].map((o,oi)=>`<option ${planIdx(pi,S.plan[p[0]])===oi?'selected':''}>${o}</option>`).join('')}</select>`:p[2]==='area'?`<textarea data-plan="${p[0]}" id="pl-${p[0]}" style="min-height:90px">${esc(S.plan[p[0]]||'')}</textarea>`:`<input data-plan="${p[0]}" id="pl-${p[0]}" value="${esc(S.plan[p[0]]||'')}">`}</label>`).join('')}</div></section>
  <button class="btn ghost" data-a="copyplan" style="align-self:flex-start">${t('copy_text')}</button>`;
}

/* ============ SHEETS ============ */
const layer=document.getElementById('layer');
function sheet(html){layer.innerHTML=`<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){layer.innerHTML=''}
function settingsSheet(keep){
  const v=keep||{fpp:S.fpp,nick:S.nick,twins:S.twins,solo:S.solo};
  sheet(`<h2>${t('settings')}</h2>
  <div class="stack" style="gap:6px"><span class="label">${t('language')}</span><div class="langs" role="group" aria-label="${t('language')}">${LANG_NAMES.map(([k,n])=>`<button type="button" data-a="lang" data-v="${k}" aria-pressed="${LANG===k}">${n}</button>`).join('')}</div></div>
  <form class="f" id="setForm">
    <label class="stack" style="gap:4px"><span class="label">${t('due_label')}</span><input type="date" id="sFpp" value="${v.fpp}"></label>
    <p class="muted" style="font-size:.85rem">${t('lmp_hint')}</p>
    <div class="row" style="flex-wrap:nowrap"><input type="date" id="sFur" aria-label="${esc(t('lmp_aria'))}"><button class="btn ghost small" type="button" data-a="fur">${t('calc')}</button></div>
    <label class="stack" style="gap:4px"><span class="label">${t('nick')}</span><input id="sNick" placeholder="${esc(t('nick_ph'))}" value="${esc(v.nick)}"></label>
    <div class="stack" style="gap:6px"><span class="label">${t('style')}</span><div class="skins">${SKINS.map(k=>`<button type="button" data-a="skin" data-v="${k[0]}" aria-pressed="${S.skin===k[0]}"><span class="sw">${k[2].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${k[1]}</button>`).join('')}</div></div>
    <label class="toggle"><span>${t('twins')}</span><input type="checkbox" id="sTwins" ${v.twins?'checked':''}></label>
    <label class="toggle"><span>${t('solo')}</span><input type="checkbox" id="sSolo" ${v.solo?'checked':''}></label>
    <button class="btn accent" type="submit">${t('save')}</button>
  </form>
  <button class="btn ghost small" data-a="ask" data-v="resetAll" style="align-self:flex-start">${t('delete_all')}</button>
  <p class="muted" style="font-size:.8rem">${t('no_weight')}</p>`);
}
const SKIN_BG={salvia:'#F5F6F1',pomelo:'#FCF6F3',cielo:'#F3F6FA'};
function applySkin(){document.documentElement.dataset.skin=S.skin||'salvia';document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',SKIN_BG[S.skin]||SKIN_BG.salvia))}
function ask(key){
  let msg,fn;
  if(key.startsWith('delList:')){const id=key.split(':')[1];msg=t('ask_list');fn=()=>{S.lists=S.lists.filter(l=>l.id!==id)}}
  else if(key==='resetContr'){msg=t('ask_contr');fn=()=>{S.contr=[];S.contrOn=null}}
  else if(key==='resetAll'){msg=t('ask_all');fn=()=>{const tb=S.tab,lg=S.lang;S=defaults();S.tab=tb;S.lang=lg;applyLang();closeSheet()}}
  sheet(`<h3>${msg}</h3><div class="row"><button class="btn" id="yes">${t('yes_delete')}</button><button class="btn ghost" data-a="close">${t('cancel')}</button></div>`);
  document.getElementById('yes').onclick=()=>{fn();closeSheet();commit()};
}
function realSheet(w){
  const s=SIZE[w];
  sheet(`<h2>${t('real_title',{w})}</h2><p class="muted">${t('real_txt',{x:cmTxt(s[0])})}${s[0]>9?t('swipe_all'):''}</p>
  <div class="ruler"><div class="r" style="width:${Math.max(s[0],0.1)}cm"></div></div>
  <p class="quip">${w>=20?t('real_big'):t('real_small')}</p>
  <button class="btn" data-a="close" style="align-self:flex-start">${t('close')}</button>`);
}

/* ============ LATIDO (sintetizado) ============ */
const beat={on:false,ctx:null,timer:null,noise:null};
function startBeat(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;beat.ctx=new AC();const ctx=beat.ctx;
    const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    const g=ctx.createGain();g.gain.value=0.25;src.connect(lp).connect(g).connect(ctx.destination);src.start();beat.noise=src;
    const thump=(tt,f,v)=>{const o=ctx.createOscillator(),gg=ctx.createGain();o.frequency.setValueAtTime(f,tt);o.frequency.exponentialRampToValueAtTime(f*0.5,tt+0.12);gg.gain.setValueAtTime(0.0001,tt);gg.gain.exponentialRampToValueAtTime(v,tt+0.015);gg.gain.exponentialRampToValueAtTime(0.0001,tt+0.14);o.connect(gg).connect(ctx.destination);o.start(tt);o.stop(tt+0.16)};
    const bpm=142,iv=60/bpm;let next=ctx.currentTime+0.1;
    beat.timer=setInterval(()=>{while(next<ctx.currentTime+0.3){thump(next,90,0.9);thump(next+0.14,75,0.5);next+=iv}},50);
    beat.on=true;
  }catch(e){toast(t('no_sound'))}
}
function stopBeat(){clearInterval(beat.timer);try{beat.noise&&beat.noise.stop();beat.ctx&&beat.ctx.close()}catch(e){}beat.on=false}

/* ============ RENDER ============ */
const app=document.getElementById('app');
function render(){
  applySkin();
  app.innerHTML=({hoy:vHoy,semanas:vSemanas,agenda:vAgenda,notas:vNotas,kit:vKit})[S.tab]();
  document.getElementById('tabs').innerHTML=TABS.map(x=>`<button data-a="tab" data-v="${x[0]}" ${S.tab===x[0]?'aria-current="page"':''}>${ICONS[x[0]]}${x[1]}</button>`).join('');
  if(S.tab==='semanas'){const b=document.querySelector('.weeks [aria-pressed="true"]');if(b)b.scrollIntoView({inline:'center',block:'nearest'})}
}
function commit(){save();render()}
let toastT;function toast(m){clearTimeout(toastT);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;toastT=setTimeout(()=>el.remove(),2200)}
function copy(text){const ok=()=>toast(t('copied'));try{navigator.clipboard.writeText(text).then(ok,()=>fallback(text))}catch(e){fallback(text)}}
function fallback(text){sheet(`<h3>${t('copy_this')}</h3><textarea id="cp" readonly style="min-height:120px">${esc(text)}</textarea><button class="btn" data-a="close" style="align-self:flex-start">${t('ok')}</button>`);const el=document.getElementById('cp');el.focus();el.select()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'tab':S.tab=v;window.scrollTo(0,0);commit();break;
    case 'settings':settingsSheet();break;
    case 'lang':{const keep={fpp:document.getElementById('sFpp').value,nick:document.getElementById('sNick').value,twins:document.getElementById('sTwins').checked,solo:document.getElementById('sSolo').checked};
      S.lang=v;noteMoods=[];applyLang();save();render();settingsSheet(keep);break}
    case 'skin':S.skin=v;save();applySkin();document.querySelectorAll('.skins button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));render();break;
    case 'close':if(e.target===el||el.tagName==='BUTTON')closeSheet();break;
    case 'cat':S.cat=v;commit();break;
    case 'week':S.weekView=+v;commit();break;
    case 'real':realSheet(+el.dataset.w);break;
    case 'beat':beat.on?stopBeat():startBeat();render();break;
    case 'copy':copy(v);break;
    case 'test':S.testsDone[v]=!S.testsDone[v];commit();break;
    case 'delappt':S.appts=S.appts.filter(x=>x.id!==v);commit();break;
    case 'copyappt':{const x=S.appts.find(y=>y.id===v);copy(`${x.title} — ${fmtD(parse(x.date),{weekday:'long',day:'numeric',month:'long'})}${x.time?t('at_time',{t:x.time}):''}${x.place?' · '+x.place:''}`);break}
    case 'mood':noteMoods=noteMoods.includes(v)?noteMoods.filter(x=>x!==v):noteMoods.concat([v]);{const tx=document.getElementById('noteText').value;render();document.getElementById('noteText').value=tx}break;
    case 'prompt':notePrompt=(notePrompt+1)%PROMPTS.length;document.getElementById('noteText').placeholder=PROMPTS[notePrompt];break;
    case 'savenote':{const tx=document.getElementById('noteText').value.trim();if(!tx){toast(t('write_something'));break}S.notes.push({id:uid(),at:Date.now(),moods:noteMoods.slice(),text:tx});noteMoods=[];commit();toast(t('note_saved'));break}
    case 'delnote':S.notes=S.notes.filter(n=>n.id!==v);commit();break;
    case 'kit':S.kit=v||null;window.scrollTo(0,0);commit();break;
    case 'contr':if(S.contrOn){S.contr.push({s:S.contrOn,e:Date.now()});S.contrOn=null}else S.contrOn=Date.now();commit();break;
    case 'ask':ask(v);break;
    case 'bag':S.bag[v]=!S.bag[v];commit();break;
    case 'delbag':S.bagCustom=S.bagCustom.filter(i=>i.id!==v);delete S.bag[v];commit();break;
    case 'li':{const [l,i]=v.split(':');const it=S.lists.find(x=>x.id===l).items.find(x=>x.id===i);it.done=!it.done;commit();break}
    case 'delli':{const [l,i]=v.split(':');const L=S.lists.find(x=>x.id===l);L.items=L.items.filter(x=>x.id!==i);commit();break}
    case 'nstat':{const [id,s]=v.split(':');S.names.find(n=>n.id===id).s=s;commit();break}
    case 'delname':S.names=S.names.filter(n=>n.id!==v);commit();break;
    case 'kickstart':S.kickOn={s:Date.now(),n:0};commit();break;
    case 'kick':S.kickOn.n++;commit();break;
    case 'kickstop':S.kicks.push({s:S.kickOn.s,n:S.kickOn.n,d:(Date.now()-S.kickOn.s)/1000});S.kickOn=null;commit();break;
    case 'copyplan':copy(t('my_plan')+'\n\n'+PLAN.map((p,pi)=>{const val=S.plan[p[0]];const i=p[2]==='sel'?planIdx(pi,val):-1;return `${p[1]}: ${i>=0?p[3][i]:(val||t('undecided_l'))}`}).join('\n'));break;
    case 'fur':{const f=document.getElementById('sFur').value;if(!f){toast(t('lmp_first'));break}document.getElementById('sFpp').value=iso(addDays(parse(f),280));toast(t('date_calc'));break}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='apptForm'){S.appts.push({id:uid(),title:f.querySelector('#apTitle').value.trim(),date:f.querySelector('#apDate').value,time:f.querySelector('#apTime').value,place:f.querySelector('#apPlace').value.trim()});commit();toast(t('appt_added'))}
  else if(f.id==='setForm'){const fpp=document.getElementById('sFpp').value;if(!fpp){toast(t('missing_due'));return}
    if(S.sample){S.notes=S.notes.filter(n=>!n.ex);S.appts=S.appts.filter(a=>!a.ex)}
    S.fpp=fpp;S.nick=document.getElementById('sNick').value;S.twins=document.getElementById('sTwins').checked;S.solo=document.getElementById('sSolo').checked;S.sample=false;S.weekView=null;closeSheet();commit();toast(t('saved'))}
  else if(f.id==='bagForm'){const tx=document.getElementById('bagIn').value.trim();if(tx){S.bagCustom.push({id:'c'+uid(),t:tx});commit()}}
  else if(f.id==='newList'){const tx=document.getElementById('newListIn').value.trim();if(tx){S.lists.push({id:uid(),name:tx,items:[]});commit()}}
  else if(f.id==='nameForm'){const tx=document.getElementById('nameIn').value.trim();if(tx){S.names.push({id:uid(),n:tx,s:'maybe'});commit();document.getElementById('nameIn').focus()}}
  else if(f.dataset.list){const L=S.lists.find(x=>x.id===f.dataset.list);const inp=f.querySelector('input');const tx=inp.value.trim();if(tx){L.items.push({id:uid(),t:tx,done:false});commit();const n=document.getElementById('li-'+L.id);n&&n.focus()}}
});
document.addEventListener('change',e=>{const p=e.target.dataset&&e.target.dataset.plan;if(p){S.plan[p]=e.target.value;save()}});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.plan;if(p&&e.target.tagName!=='SELECT'){S.plan[p]=e.target.value;save()}});
setInterval(()=>{const c=document.getElementById('cTimer');if(c&&S.contrOn)c.textContent=mmss((Date.now()-S.contrOn)/1000);const k=document.getElementById('kTimer');if(k&&S.kickOn)k.textContent=mmss((Date.now()-S.kickOn.s)/1000)},500);
applyLang();
render();
(function(){const sp=document.getElementById('splash');if(!sp)return;const hide=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),600)};
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;setTimeout(hide,reduce?300:1600);sp.addEventListener('click',hide)})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
